version: '3.8'

services:
  ai-service:
    build: ./ai-service
    ports:
      - "5000:5000"
    environment:
      - BACKEND_URL=http://backend:8080
      - YOLO_MODEL=yolov8n.pt
    volumes:
      - ./ai-service:/app
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      - AI_SERVICE_URL=http://ai-service:5000
      - SPRING_PROFILES_ACTIVE=docker
    volumes:
      - backend-data:/app/data
    depends_on:
      - ai-service
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  backend-data:
